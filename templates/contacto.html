<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Empresa</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/contacto.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- NAVBAR (igual que inicio) -->
<header class="navbar">
    <div class="logo">
        <img src="{{ url_for('static', filename='img/logo1.png') }}">
    </div>

    <nav>
        <a href="/">Inicio</a>
        <a href="/nosotros">Nosotros</a>
        <a href="/servicios">Servicios</a>
        <a href="/proyectos">Proyectos</a>
        <a href="/contacto">Contáctanos</a>
    </nav>
</header>

<!-- CONTACTO -->
<section class="section contacto">

    <h1>Contáctanos</h1>

    <div class="contacto-container">

        <!-- IZQUIERDA: INFORMACIÓN -->
        <div class="contacto-info">

            <h2>Datos de la Empresa</h2>

            <p><i class="fas fa-building"></i> CORPORACION PUERTA GRANDE E.I.R.L.</p>
            <p><i class="fas fa-id-card"></i> RUC: 20601519390</p>
            <p><i class="fas fa-briefcase"></i> Construcción de edificios completos</p>
            <p><i class="fas fa-map-marker-alt"></i> Chiclayo, Lambayeque - Perú</p>
            <p><i class="fas fa-phone"></i> 975 457 825 / <a href="https://wa.me/51920493433" target="_blank" rel="noopener">+51 920 493 433</a></p>
            <p><i class="fas fa-envelope"></i> cpgsuelosypavimentos@gmail.com</p>

        </div>

        <!-- DERECHA: FORMULARIO -->
        <div class="contacto-form">

            <h2>Envíanos un mensaje</h2>

            <form id="contacto-form">
                <input id="nombre" type="text" placeholder="Nombre completo" autocomplete="name" required>
                <input id="correo" type="email" placeholder="Correo electrónico" autocomplete="email" required>
                <input id="telefono" type="tel" placeholder="Teléfono" autocomplete="tel">
                <textarea id="mensaje" placeholder="Escribe tu mensaje..." required></textarea>
                <button type="submit">Enviar mensaje</button>
            </form>

        </div>

    </div>

</section>

<!-- WHATSAPP -->
<a href="https://wa.me/51920493433" class="whatsapp-float" target="_blank" rel="noopener" aria-label="WhatsApp">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
    const contactoForm = document.getElementById("contacto-form");

    contactoForm.addEventListener("submit", function(event) {
        event.preventDefault();

        if (!contactoForm.checkValidity()) {
            contactoForm.reportValidity();
            return;
        }

        const nombre = document.getElementById("nombre").value.trim();
        const correo = document.getElementById("correo").value.trim();
        const telefono = document.getElementById("telefono").value.trim();
        const mensaje = document.getElementById("mensaje").value.trim();

        const texto = [
            "Hola, quiero solicitar informacion.",
            "",
            `Nombre: ${nombre}`,
            `Correo: ${correo}`,
            telefono ? `Telefono: ${telefono}` : null,
            "",
            `Mensaje: ${mensaje}`
        ].filter(Boolean).join("\n");

        const whatsappUrl = `https://wa.me/51920493433?text=${encodeURIComponent(texto)}`;
        window.open(whatsappUrl, "_blank", "noopener");
        contactoForm.reset();
    });
</script>

</body>
</html>
